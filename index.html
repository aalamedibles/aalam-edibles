<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Aalam Edibles — for guilt-free servings. Connect with us on WhatsApp and Instagram."
  >

  <title>Aalam Edibles | For guilt-free servings</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <main class="page">

    <section class="hero">

      <!-- Logo -->
      <div class="logo-wrap">
        <img
          src="logo.png"
          alt="Aalam Edibles — for guilt-free servings"
          class="logo"
        >
      </div>


      <!-- Welcome message -->
      <p class="intro">
        Welcome to <strong>Aalam Edibles</strong>.
      </p>


      <!-- Social / Contact Buttons -->
      <div class="links">

        <!-- WhatsApp -->
        <a
          class="link-button whatsapp-button"
          href="https://wa.me/918015657977"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span
            class="brand-icon whatsapp-icon"
            aria-hidden="true"
          >
            <svg viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.14 2 11.25c0 1.83.58 3.54 1.68 4.96L2.1 21.5l5.46-1.46A10.5 10.5 0 0 0 12 20.5c5.52 0 10-4.14 10-9.25S17.52 2 12 2Zm0 16.6c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.24.87.87-3.1-.2-.31a7.1 7.1 0 0 1-1.1-3.78c0-3.94 3.66-7.15 8.17-7.15s8.17 3.21 8.17 7.15S16.51 18.6 12 18.6Zm4.47-5.36c-.25-.12-1.47-.72-1.7-.8-.23-.09-.4-.12-.57.12-.17.25-.65.8-.8.97-.15.17-.3.19-.55.07-.25-.12-1.03-.36-1.96-1.16-.72-.61-1.2-1.36-1.34-1.59-.14-.25-.02-.38.1-.5.11-.11.25-.3.37-.45.12-.15.16-.25.25-.42.08-.17.04-.32-.02-.44-.06-.12-.57-1.37-.78-1.88-.2-.48-.4-.42-.57-.43h-.48c-.17 0-.44.06-.67.32-.23.25-.88.86-.88 2.1 0 1.24.9 2.43 1.02 2.6.12.17 1.76 2.69 4.27 3.77.6.26 1.07.41 1.43.52.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.15-1.18-.06-.1-.23-.16-.48-.28Z"/>
            </svg>
          </span>

          <span>Message us on WhatsApp</span>

        </a>


        <!-- Instagram -->
        <a
          class="link-button instagram-button"
          href="https://www.instagram.com/aalamedibles/?hl=en"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span
            class="brand-icon instagram-icon"
            aria-hidden="true"
          >
            <svg viewBox="0 0 24 24">
              <rect
                x="3"
                y="3"
                width="18"
                height="18"
                rx="5"
              />

              <circle
                cx="12"
                cy="12"
                r="4"
              />

              <circle
                cx="17.5"
                cy="6.5"
                r="1"
              />
            </svg>
          </span>

          <span>Follow us on Instagram</span>

        </a>

      </div>


      <!-- Footer -->
      <footer>

        <p>
          © <span id="year"></span> Aalam Edibles
        </p>

        <p class="tagline">
          for guilt-free servings
        </p>

      </footer>

    </section>

  </main>


  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>

</body>

</html>
